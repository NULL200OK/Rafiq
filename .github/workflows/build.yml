name: Build Rafiq APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🔍 فحص بنية المشروع
        run: |
          echo "========== ملفات الجذر =========="
          ls -la
          echo "========== settings.gradle.kts =========="
          cat settings.gradle.kts || echo "❌ غير موجود!"
          echo "========== app/build.gradle.kts (أول 15 سطراً) =========="
          head -15 app/build.gradle.kts || echo "❌ غير موجود!"
          echo "========== gradle.properties =========="
          cat gradle.properties || echo "❌ غير موجود!"
          echo "========== app/src/main =========="
          ls -la app/src/main

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build APK (مع إعادة محاولة تلقائية)
        run: |
          gradle assembleDebug --stacktrace || \
          (echo "⚠️ محاولة أولى فشلت — إعادة بعد 20 ثانية..." && sleep 20 && gradle assembleDebug --stacktrace)

      - name: Verify APK
        run: find app/build/outputs -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rafiq-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
