name: Build Rafiq APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build APK
        id: build
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          echo "===== قائمة ملفات APK ====="
          find app/build/outputs -name "*.apk" -type f
          echo "==========================="

      - name: Upload APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Rafiq-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Fallback — انشر APK في Releases
        if: failure() && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create rafiq-build-${{ github.run_number }} \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Rafiq APK — Build #${{ github.run_number }}" \
            --notes "تحميل مباشر لتطبيق رفيق"
